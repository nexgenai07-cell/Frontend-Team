<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Day1-task</title>
</head>
<body>
    <!-- header -->
    <div class="header">
        <div id="logo">Fazail</div>                  <!--logo-->
        <div class="navlinks"> <!--Navigation links-->
            <li><a href="">Home</a></li>
            <li><a href="">About</a></li>
            <li><a href="">Contact</a></li>
        </div>
        <div class="loginbtn"><!--Login link-->
             <a href="login.html" class="login">Login</a>
        </div>
    </div>
   <!--header ends here-->


   
   <!-- Product section -->
<div class="products">

    <!-- Card 1 -->
    <div class="card">
        <div class="card-img">
            <img src="images/img1.webp" alt="headphones">
        </div>

        <div class="card-info">
            <p class="product-name">Headphones</p>
            <p class="price">$20</p>
        </div>

        <div>
            <button class="btn">Add to Cart</button>
        </div>
    </div>

    <!-- Card 2 -->
    <div class="card">
        <div class="card-img">
            <img src="images/img2.jpg" alt="Shoes">
        </div>

        <div class="card-info">
            <p class="product-name">Shoes</p>
            <p class="price">$20</p>
        </div>

        <div>
            <button class="btn">Add to Cart</button>
        </div>
    </div>

    <!-- Card 3 -->
    <div class="card">
        <div class="card-img">
            <img src="images/img3.avif" alt="Watch">
        </div>

        <div class="card-info">
            <p class="product-name">Watch</p>
            <p class="price">$20</p>
        </div>

        <div>
            <button class="btn">Add to Cart</button>
        </div>
    </div>

</div>

<!--Product section ends here-->


<!--Footer-->
<div class="footer">
      <p>© 2026 Fazail. All rights reserved.</p>
</div>
