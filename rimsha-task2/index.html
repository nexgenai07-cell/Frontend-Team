<!doctype html>

<!-- Starting of HTML -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title shown on browser tab -->

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>

    <div class="main-container">

      <div class="header">
